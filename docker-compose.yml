services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus_migrator
      POSTGRES_PASSWORD: nexus_migrator
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_migrator -d nexus"]
      interval: 3s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: ./frontend
    environment: {NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"}
    ports: ["3000:3000"]
    depends_on: [api]
volumes: {postgres_data: {}}
