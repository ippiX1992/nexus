name: Nexus Modules 1-2 Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  NODE_VERSION: "22.14.0"

jobs:
  backend-quality:
    name: Backend quality, PostgreSQL, RLS, Platform Kernel and package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://nexus_app:nexus_app@127.0.0.1:5432/nexus_test
      TEST_DATABASE_URL: postgresql+asyncpg://nexus_app:nexus_app@127.0.0.1:5432/nexus_test
      DATABASE_MIGRATION_URL: postgresql+psycopg://nexus_migrator:nexus_migrator@127.0.0.1:5432/nexus_test
      TEST_DATABASE_MIGRATION_URL: postgresql+psycopg://nexus_migrator:nexus_migrator@127.0.0.1:5432/nexus_test
      JWT_SECRET: github-actions-module-1-only-not-a-real-secret-2026
      ALLOWED_ORIGINS: http://testserver,http://127.0.0.1:3000
      COOKIE_SECURE: "false"
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up fixed Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend from scratch
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" build
      - name: Create isolated PostgreSQL roles and empty database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -f scripts/create_database_roles.sql
      - name: Verify application role cannot bypass RLS
        env:
          PGPASSWORD: nexus_app
        run: |
          flags="$(psql -h 127.0.0.1 -U nexus_app -d nexus_test -Atc "SELECT rolsuper::text || ',' || rolbypassrls::text FROM pg_roles WHERE rolname = current_user")"
          test "$flags" = "false,false"
      - name: Upgrade Module 1 to Platform Kernel, downgrade, re-upgrade and rebuild from base
        run: |
          alembic upgrade head
          alembic downgrade 0001
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Ruff
        run: python -m ruff check app tests scripts
      - name: mypy
        run: python -m mypy --no-incremental app
      - name: Focused RLS and concurrency tests
        run: python -m pytest -q tests/integration/test_rls.py tests/integration/test_platform_rls.py tests/integration/test_refresh_concurrency.py tests/integration/test_platform_concurrency.py
      - name: Pytest and coverage gate
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80
      - name: Build wheel and sdist
        run: python -m build
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-backend-evidence
          if-no-files-found: warn
          path: |
            coverage.xml
            htmlcov/
            dist/

  frontend-quality:
    name: Frontend tests, lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up fixed Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

  playwright-e2e:
    name: Playwright identity and Platform Kernel E2E
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://nexus_app:nexus_app@127.0.0.1:5432/nexus_test
      DATABASE_MIGRATION_URL: postgresql+psycopg://nexus_migrator:nexus_migrator@127.0.0.1:5432/nexus_test
      JWT_SECRET: github-actions-module-1-e2e-only-not-a-real-secret
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      COOKIE_SECURE: "false"
      REDIS_URL: redis://127.0.0.1:6379/0
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      E2E_API_URL: http://127.0.0.1:8000/api/v1
      E2E_PASSWORD: E2E-only-not-a-real-password-99
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up fixed Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Set up fixed Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and frontend from scratch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci --prefix frontend
      - name: Install official Chromium and Linux dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Create roles and migrate empty E2E database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -f scripts/create_database_roles.sql
          alembic upgrade head
      - name: Run real browser flow and close services
        shell: bash
        run: |
          mkdir -p artifacts/logs
          BACKEND_PID=""
          FRONTEND_PID=""
          cleanup() {
            if [ -n "$FRONTEND_PID" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi
            if [ -n "$BACKEND_PID" ]; then kill "$BACKEND_PID" 2>/dev/null || true; fi
            wait "$FRONTEND_PID" 2>/dev/null || true
            wait "$BACKEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > artifacts/logs/backend.log 2>&1 &
          BACKEND_PID=$!
          node frontend/node_modules/next/dist/bin/next dev frontend --hostname 127.0.0.1 --port 3000 > artifacts/logs/frontend.log 2>&1 &
          FRONTEND_PID=$!

          backend_ready=false
          frontend_ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health > /dev/null; then backend_ready=true; break; fi
            sleep 1
          done
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then frontend_ready=true; break; fi
            sleep 1
          done
          if [ "$backend_ready" != true ] || [ "$frontend_ready" != true ]; then
            echo "Backend or frontend did not become healthy"
            exit 1
          fi

          npm --prefix frontend run test:e2e
      - name: Sanitize service logs
        if: always()
        shell: bash
        run: |
          if [ -d artifacts/logs ]; then
            sed -E -i 's/(Bearer )[A-Za-z0-9._~-]+/\1[REDACTED]/g; s/(access_token|refresh_token|challenge_token|password)[=:][^[:space:]]+/\1=[REDACTED]/g' artifacts/logs/*.log 2>/dev/null || true
          fi
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-playwright-evidence
          if-no-files-found: warn
          path: |
            frontend/playwright-report/
            frontend/test-results/
            artifacts/logs/

  modules-1-2-gate:
    name: Modules 1-2 final gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-quality
      - frontend-quality
      - playwright-e2e
    steps:
      - name: Require every critical job to pass
        env:
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          E2E_RESULT: ${{ needs.playwright-e2e.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$E2E_RESULT" = "success"
