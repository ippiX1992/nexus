[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-platform"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2,<3",
  "asyncpg>=0.30,<1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3", "cryptography>=44,<46", "pyotp>=2.9,<3",
  "python-multipart>=0.0.20,<1", "babel>=2.17,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1",
  "testcontainers[postgres]>=4.9,<5", "coverage[toml]>=7.6,<8",
  "pytest-cov>=6,<7", "ruff>=0.9,<1", "mypy>=1.14,<2"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL/Docker"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702"] # Legacy compact layout; semantic lint remains enforced.

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
